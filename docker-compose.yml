version: '3.9'

services:
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - ./db:/data/db
    networks:
      - backend-network

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
    environment:
      - MONGO_URI=mongodb://mongodb:27017/whatdoweeat
      # Path *inside the container* where recipe markdown files are mounted.
      # The host folder is set via the RECIPES_HOST_DIR env var (see .env or
      # your shell), defaulting to ~/Dropbox/ideaverse/Recettes/recette-templated.
      - RECIPES_DIR=/recipes
    volumes:
      # Mount the user's Obsidian recipe folder read-only.
      - ${RECIPES_HOST_DIR:-~/Dropbox/ideaverse/Recettes/recette-templated}:/recipes:ro
    networks:
      - backend-network

  frontend:
    build: ./frontend
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - backend-network

networks:
  backend-network:
    driver: bridge